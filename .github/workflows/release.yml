name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          UNIX_TIMESTAMP="$(date +%s)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "unix_timestamp=$UNIX_TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UNIX_TIMESTAMP: ${{ steps.version.outputs.unix_timestamp }}
        run: |
          set -e

          ADDON_NAME="QuickEmoteMenu"
          BUILD_DIR="build"
          OUTPUT="${ADDON_NAME}-v${VERSION}.zip"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          # Copy the addon directory
          cp -R "$ADDON_NAME" "$BUILD_DIR/"

          # Replace placeholders in the copied files
          sed -i \
            -e "s/__BUILD_VERSION__/${VERSION}/g" \
            -e "s/__UNIX_TIMESTAMP__/${UNIX_TIMESTAMP}/g" \
            "$BUILD_DIR/$ADDON_NAME/QuickEmoteMenu.addon"

          sed -i \
            -e "s/__BUILD_VERSION__/${VERSION}/g" \
            "$BUILD_DIR/$ADDON_NAME/QuickEmoteMenu.lua"

          # Create ZIP with the addon folder as the root
          cd "$BUILD_DIR"
          zip -qr "../$OUTPUT" "$ADDON_NAME"

          cd ..

          echo "Created:"
          ls -lh "$OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: QuickEmoteMenu-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
